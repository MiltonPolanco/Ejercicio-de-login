<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuario</title>
  <style>
    body {
      background: #f2f2f2;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      color: #333;
    }
    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .profile-info {
      font-size: 1.1em;
      margin-bottom: 20px;
    }
    .profile-info span {
      font-weight: bold;
      color: #337ab7;
    }
    button {
      padding: 10px 20px;
      background: #d9534f;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
      display: block;
      margin: 0 auto;
    }
    button:hover {
      background: #c9302c;
    }
  </style>
</head>
<body>
  <div class="container">
      <h1>Perfil de Usuario</h1>
      <div class="profile-info">
          <p>Bienvenido, <span id="usernameDisplay">Usuario</span></p>
          <p>ID: <span id="userIdDisplay">?</span></p>
      </div>
      <button id="logoutButton">Cerrar Sesión</button>
  </div>
  <script src="profile.js"></script>
</body>
</html>
