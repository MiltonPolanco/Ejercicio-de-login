<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <style>
    body {
      background: #f2f2f2;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      width: 360px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #337ab7;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #286090;
    }
    .message {
      text-align: center;
      margin-top: 12px;
      color: red;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9em;
      color: #777;
    }
    .footer a {
      color: #337ab7;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
      <h1>Iniciar Sesión</h1>
      <form id="loginForm">
          <label for="username">Usuario:</label>
          <input type="text" id="username" required>
          <label for="password">Contraseña:</label>
          <input type="password" id="password" required>
          <button type="submit">Ingresar</button>
      </form>
      <p id="loginMessage" class="message"></p>
      <div class="footer">
         <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
      </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
